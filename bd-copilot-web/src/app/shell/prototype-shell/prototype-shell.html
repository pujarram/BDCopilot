<div class="app-shell">
  <nav id="app-nav" class="rail" [class.is-open]="menuOpen()">
    @for (section of nav; track section.title) {
      <div class="rail-label">{{ section.title }}</div>
      @for (item of section.items; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" (click)="closeMenu()">
          <tieto-icon [name]="item.icon" />
          {{ item.label }}
        </a>
      }
    }
  </nav>

  <div class="panel">
    <router-outlet />
  </div>
</div>
